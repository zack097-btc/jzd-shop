[package]
name = "jzd-shop"
version = "2.9.2"
description = "JZD Shop Manager — customers, vehicles, work orders"
authors = ["JZac Designs"]
edition = "2021"
rust-version = "1.77"

# Desktop only, so this is a plain program — no library crate of the kind the
# Tauri template carries for phone builds.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Shop Sync: the local Shop Hub and each computer's connection to it
jzd-shophub = { path = "../shophub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Request signing for licensed data providers. The RustCrypto crates, not our
# own code; sha2 and base64 are already in the build through Tauri itself.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
# MIT/Apache-2.0 — permissive, so it does not affect what we may charge for this

[profile.release]
# a shop program is opened all day: make it small and quick to start
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
