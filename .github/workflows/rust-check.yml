# Compiles and tests the desktop shell on a work branch, without building an
# installer or publishing anything. Push to a branch named ci/<anything>.
#
# Failures are also written out as annotations, which are visible on the
# public run page without signing in.
name: Desktop shell check

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Reuse compiled crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/shophub
      - name: Stage the page
        shell: pwsh
        run: python build.py
      - name: Test the desktop shell
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo test 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content test.log
            $hits = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(error|warning: unused)|panicked at|^test .* FAILED|^failures:') {
                if ($lines[$i] -match '^warning') { continue }
                $end = [Math]::Min($i + 14, $lines.Count - 1)
                $hits += ,(($lines[$i..$end] -join '%0A') -replace '::', ': :')
              }
            }
            $hits | Select-Object -First 9 | ForEach-Object { Write-Output "::error::$_" }
            exit $code
          }
          Get-Content test.log | Where-Object { $_ -match '^test result:' } | ForEach-Object { Write-Output "::notice title=cargo test::$_" }
          cargo test a_secret_goes_in -- --nocapture 2>&1 | Where-Object { $_ -match '^CREDMAN:' } | ForEach-Object { Write-Output "::notice title=Credential Manager::$_" }

      - name: Test Shop Sync (engine, hub, three computers)
        shell: pwsh
        working-directory: desktop/shophub
        run: |
          cargo test 2>&1 | Tee-Object -FilePath sync.log
          $code = $LASTEXITCODE
          Get-Content sync.log | Where-Object { $_ -match '^test |^test result:|panicked|MEASURED|^error' } | ForEach-Object { Write-Output ("::notice title=Shop Sync::" + ($_ -replace '::', ': :')) }
          if ($code -ne 0) { exit $code }
          cargo build --bin shophub-sim
          exit $LASTEXITCODE

      # A real request to MOTOR's public DaaS sandbox, through the desktop app's
      # own signing and request code. The sandbox keys are the ones MOTOR
      # publishes for developers at motor.com/daas-sandbox; they are read from
      # that page at run time and are never stored in this repository.
      - name: Live MOTOR sandbox call (desktop shell)
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          $page = (Invoke-WebRequest -UseBasicParsing -Uri 'https://www.motor.com/daas-sandbox/').Content
          $pub = [regex]::Match($page, 'Public Key:\s*</b>\s*([A-Za-z0-9_\-]+)').Groups[1].Value
          $priv = [regex]::Match($page, 'Private Key:\s*</b>\s*([A-Za-z0-9_\-]+)').Groups[1].Value
          if (-not $pub -or -not $priv) {
            Write-Output "::error title=MOTOR sandbox::Could not read the published sandbox keys from motor.com/daas-sandbox"
            exit 1
          }
          Write-Output "::add-mask::$priv"
          $env:MOTOR_SANDBOX_PUBLIC = $pub
          $env:MOTOR_SANDBOX_PRIVATE = $priv
          # for the page-level live suite in the next step, this job only
          "MOTOR_SANDBOX_PUBLIC=$pub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOTOR_SANDBOX_PRIVATE=$priv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cargo test motor_sandbox_live -- --ignored --nocapture 2>&1 | Tee-Object -FilePath live.log
          $code = $LASTEXITCODE
          Get-Content live.log | Where-Object { $_ -match '^LIVE:' } | ForEach-Object {
            Write-Output ("::notice title=MOTOR sandbox::" + ($_ -replace '::', ': :'))
          }
          if ($code -ne 0) {
            $lines = Get-Content live.log
            $hits = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^error|panicked at') {
                $end = [Math]::Min($i + 8, $lines.Count - 1)
                $hits += ,(($lines[$i..$end] -join '%0A') -replace '::', ': :')
              }
            }
            $hits | Select-Object -First 5 | ForEach-Object { Write-Output "::error title=MOTOR sandbox::$_" }
            exit $code
          }

      - name: Live MOTOR sandbox call (page adapters) and the data provider suite
        shell: pwsh
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node testdata.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node testmpi.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SHOPHUB_SIM = "$PWD/desktop/shophub/target/debug/shophub-sim.exe"
          node testsync.cjs 2>&1 | Tee-Object -FilePath sync-page.log
          $code = $LASTEXITCODE
          Get-Content sync-page.log | Where-Object { $_ -match 'FAIL|measured|ALL SHOP' } | ForEach-Object { Write-Output ("::notice title=Shop Sync page::" + ($_.Trim() -replace '::', ': :')) }
          if ($code -ne 0) { exit $code }
          if (Test-Path testmaint.cjs) { node testmaint.cjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          node testmotorlive.cjs 2>&1 | Tee-Object -FilePath motorlive.log
          $code = $LASTEXITCODE
          Get-Content motorlive.log | Where-Object { $_ -match 'PASS|FAIL|SKIPPED|MOTOR sandbox calls|Vehicle:' } | ForEach-Object {
            Write-Output ("::notice title=MOTOR sandbox page::" + ($_.Trim() -replace '::', ': :'))
          }
          exit $code
