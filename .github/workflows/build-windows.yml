# Builds the installable Windows version of JZD Shop Manager.
#
# Push a tag like v10.0.0 and this produces a signed-ready .exe installer and a
# .msi, attaches both to a GitHub Release, and leaves them downloadable. Run it
# by hand from the Actions tab any time you just want a fresh build to test.
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reuse the last build's compiled crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/shophub

      # build.py stages index.html into desktop/dist and REFUSES to run if the
      # version on screen disagrees with the installer's, so the app can never
      # claim a version the build did not produce.
      - name: Build the app and stage it into the shell
        shell: pwsh
        run: |
          python build.py
          Get-ChildItem desktop/dist

      # One logo lives in this repository; every size the installer and the
      # taskbar want is cut from it here rather than kept as more copies.
      - name: Cut the icons from the logo
        run: |
          python -m pip install --quiet pillow
          python desktop/make_icons.py

      # The native storage layer - the book AND every attachment - is compiled
      # and tested here and nowhere else: the machine this is developed on has
      # no MSVC linker, so this step is the release authority for Rust changes.
      # If it fails, no installer is produced.
      - name: Test the storage layer
        working-directory: desktop/src-tauri
        run: cargo test --verbose

      # Shop Sync: the field-level engine, the hub, pairing and encryption, and
      # three computers syncing over real sockets. The harness built here lets
      # testsync.cjs run the real page on two separate "computers".
      - name: Test Shop Sync (engine, hub, three computers)
        working-directory: desktop/shophub
        shell: pwsh
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --bin shophub-sim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # These suites drive the real page in a real browser. None touches the
      # network - NHTSA and the licensed providers are answered by fixtures - so
      # a release is never blocked by NHTSA being down, and a green run means the
      # page itself works, not just that it parsed.
      - name: Test persistence, VIN, pricing, invoicing, the front office, parts, floor operations, data providers, maintenance and Shop Sync
        shell: pwsh
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          $env:SHOPHUB_SIM = "$PWD/desktop/shophub/target/debug/shophub-sim.exe"
          foreach ($t in 'testsave','testvin','testflow','testshop','testphoto','testfront','testparts','testfloor','testdata','testmpi','testmaint','testsync','testvinscan','testphone','testjobparts','testoffline','testvinlive') {
            node "$t.cjs" 2>&1 | Tee-Object -FilePath "$t.log"
            $code = $LASTEXITCODE
            Get-Content "$t.log" | Where-Object { $_ -match 'measured|FAIL|stopped|Error' } | Select-Object -First 12 | ForEach-Object { Write-Output ("::notice title=$t::" + ($_.Trim() -replace '::', ': :')) }
            if ($code -ne 0) {
              # say exactly what failed, then run it once more: the timed sync
              # checks can miss on a busy shared build machine. A second failure
              # stops the release; a pass on the second run is left as a warning.
              Get-Content "$t.log" | Where-Object { $_ -match 'FAIL|stopped' } | Select-Object -First 8 | ForEach-Object { Write-Output ("::warning title=$t (first run)::" + ($_.Trim() -replace '::', ': :')) }
              node "$t.cjs" 2>&1 | Tee-Object -FilePath "$t.log"
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                Get-Content "$t.log" | Where-Object { $_ -match 'FAIL|stopped' } | Select-Object -First 8 | ForEach-Object { Write-Output ("::error title=$t::" + ($_.Trim() -replace '::', ': :')) }
                exit $code
              }
              Write-Output "::warning title=$t::$t.cjs failed once and passed when run again"
            }
          }

      # The one release check that leaves the machine: a real request to MOTOR's
      # public DaaS sandbox, through the desktop shell's own Rust signing code and
      # through the page's adapters. The keys are the ones MOTOR publishes for
      # developers; they are read from MOTOR's page here and never stored.
      - name: Live MOTOR sandbox call
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -UseBasicParsing -Uri 'https://www.motor.com/daas-sandbox/').Content
          $pub = [regex]::Match($page, 'Public Key:\s*</b>\s*([A-Za-z0-9_\-]+)').Groups[1].Value
          $priv = [regex]::Match($page, 'Private Key:\s*</b>\s*([A-Za-z0-9_\-]+)').Groups[1].Value
          if (-not $pub -or -not $priv) { Write-Output "::error title=MOTOR sandbox::Could not read the published sandbox keys"; exit 1 }
          Write-Output "::add-mask::$priv"
          $env:MOTOR_SANDBOX_PUBLIC = $pub
          $env:MOTOR_SANDBOX_PRIVATE = $priv
          Push-Location desktop/src-tauri
          cargo test motor_sandbox_live -- --ignored --nocapture 2>&1 | Tee-Object -FilePath live.log
          $rust = $LASTEXITCODE
          Get-Content live.log | Where-Object { $_ -match '^LIVE:' } | ForEach-Object { Write-Output ("::notice title=MOTOR sandbox::" + ($_ -replace '::', ': :')) }
          Pop-Location
          if ($rust -ne 0) { exit $rust }
          node testmotorlive.cjs

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is off until a certificate exists. See desktop/SIGNING.md —
          # add the two secrets there and the same build comes out signed, with
          # no other change to this file.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop

      - name: Keep the installers as a download
        uses: actions/upload-artifact@v4
        with:
          name: JZD-Shop-Manager-Windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish a release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: JZD Shop Manager ${{ github.ref_name }}
          body: |
            Windows installer for JZD Shop Manager.

            Download `JZD Shop Manager_<version>_x64-setup.exe`, run it, and the app
            installs for the current user — no administrator rights needed.

            Your shop book is a real file on this machine, written and read
            back on every change, with a copy of the previous book kept before
            each one. Settings ▸ **Where is my data?** shows the folder. No
            account, no internet, no subscription.

            Not code-signed yet, so SmartScreen will show "Windows protected
            your PC" the first time. Click **More info ▸ Run anyway**.
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
